name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...
      - name: Smoke test
        run: |
          go build -o app .
          PORT=8080 ./app & pid=$!
          for _ in $(seq 20); do curl -fsS localhost:8080/healthz && break; sleep 0.5; done
          curl -fsS localhost:8080/
          kill $pid
